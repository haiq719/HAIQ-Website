<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HAIQ Bakery – Uganda's Boldest Cookies</title>

    <!-- ── Static SEO fallback (react-helmet overrides these per-route at runtime,
         but this guarantees a complete head for crawlers that don't execute JS) ── -->
    <meta name="description" content="HAIQ Bakery — premium handcrafted cookies baked fresh every morning in Muyenga, Kampala. Venom, Blackout, Crimson Sin, Campfire After Dark, Coconut. Order now." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="HAIQ Bakery" />
    <link rel="canonical" href="https://haiq-frontend.vercel.app/" />
    <meta name="theme-color" content="#1A0A00" />

    <!-- ── Icons & PWA ── -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/HAIQ192.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ── Open Graph fallback ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HAIQ Bakery" />
    <meta property="og:title" content="HAIQ Bakery — Made For You" />
    <meta property="og:description" content="Premium handcrafted cookies baked fresh every morning in Kampala, Uganda." />
    <meta property="og:image" content="https://haiq-frontend.vercel.app/HAIQmain.png" />
    <meta property="og:url" content="https://haiq-frontend.vercel.app/" />
    <meta property="og:locale" content="en_UG" />

    <!-- ── Twitter / X fallback ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HAIQ Bakery — Made For You" />
    <meta name="twitter:description" content="Premium handcrafted cookies baked fresh every morning in Kampala, Uganda." />
    <meta name="twitter:image" content="https://haiq-frontend.vercel.app/HAIQmain.png" />

    <!-- ── DNS prefetch for external resources ─────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://haiq-api-9im4.onrender.com" />

    <!-- ── Fonts — font-display:swap already baked into the URL ─────────── -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />

    <!-- ── Google Analytics 4 ────────────────────────────────────────────
         Replace G-XXXXXXXXXX with your Measurement ID from analytics.google.com
         Leave commented out until you have the ID.
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    ── ─────────────────────────────────────────────────────────────────── -->

    <!-- ── Google Search Console verification ────────────────────────────
         Replace content value with your verification code from search.google.com/search-console
    <meta name="google-site-verification" content="REPLACE_WITH_YOUR_CODE" />
    ── ─────────────────────────────────────────────────────────────────── -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
